name: Snake Animation

on:
  push:
    branches: [main]
    paths:
      - README.md
      - .github/workflows/snake.yml
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * *'

permissions:
  contents: write

concurrency:
  group: contribution-snake
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the profile
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main

      - name: Generate snake SVGs
        uses: Platane/snk/svg-only@d8f6715049803e982ee5ff501b6b9b7d5deeb09b # v3
        with:
          github_user_name: ${{ github.repository_owner }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          outputs: |
            assets/github-snake.svg?color_snake=#3178c6&color_dots=#eaf0f8,#c4dbfa,#8bb7f0,#518cdb,#2c61a8
            assets/github-snake-dark.svg?palette=github-dark&color_snake=#5de4c7&color_dots=#19283f,#274465,#396595,#528cce,#9cbeff

      - name: Save the updated animations
        env:
          PROFILE_BRANCH: main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/github-snake.svg assets/github-snake-dark.svg
          if git diff --cached --quiet; then
            echo "Contribution animations are already up to date."
            exit 0
          fi
          git commit -m "chore: refresh contribution animations [skip ci]"
          git pull --rebase origin "$PROFILE_BRANCH"
          git push origin "HEAD:$PROFILE_BRANCH"
